name: Docs

on:
  push:
    branches: [main]
    paths: [".documentations/**", "zensical.toml", "requirements-docs.txt", "Makefile"]
  pull_request:
    paths: [".documentations/**", "zensical.toml", "requirements-docs.txt", "Makefile"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-docs.txt
      - name: Build in strict mode, failing on broken links and anchors
        run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
